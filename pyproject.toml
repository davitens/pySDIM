[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysdim"
version = "1.1.0"
description = "Download Catalan water data (ACA SDIM): river flows, reservoirs, groundwater and water quality as pandas DataFrames"
readme = "README.md"
license = "MIT"
authors = [
    { name = "David Abert-Fernandez" },
]
requires-python = ">=3.10"
keywords = [
    "ACA",
    "Agència Catalana de l'Aigua",
    "biological indices",
    "Catalonia",
    "Catalunya",
    "environmental data",
    "groundwater",
    "hydrology",
    "open data",
    "pandas",
    "reservoirs",
    "river flow",
    "SDIM",
    "water quality",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "lxml>=4.9",
]

[project.scripts]
sdim = "sdim.cli:main"

[project.urls]
Homepage = "https://github.com/davitens/pySDIM"
Repository = "https://github.com/davitens/pySDIM"
Documentation = "https://github.com/davitens/pySDIM#readme"
Issues = "https://github.com/davitens/pySDIM/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdim*"]

[tool.setuptools.data-files]
"pysdim_metadata" = [
    "metadata/*.csv",
]
"pysdim_metadata/station_variables" = ["metadata/station_variables/*.csv"]
